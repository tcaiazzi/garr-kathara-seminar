frr defaults traditional
hostname r4
service integrated-vtysh-config
!
! n34 verso r3: percorso di backup
interface eth0
 ip ospf network point-to-point
 ip ospf cost 100
!
! n41 verso r1: percorso di backup
interface eth1
 ip ospf network point-to-point
 ip ospf cost 100
!
! LAN della sede C (CR-042): annunciata ma passiva
interface eth2
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.4
 network 10.255.0.4/32 area 0
 network 10.0.0.8/30 area 0
 network 10.0.0.12/30 area 0
 network 192.168.30.0/24 area 0
!
