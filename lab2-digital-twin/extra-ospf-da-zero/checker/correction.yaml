# Esercizio extra del Lab 2 - configurare OSPF da zero partendo dallo scheletro
#
# Uso (dalla radice del repository):
#   python3 -m kathara_lab_checker --config lab2-digital-twin/extra-ospf-da-zero/checker/correction.yaml \
#       --lab labs/lab2/ospf-da-zero --no-cache --report-type csv

lab_inline: |
  pc_a[0]="lanA"
  pc_b[0]="lanB"
  r1[0]="lanA"
  r1[1]="n12"
  r1[2]="n41"
  r2[0]="n12"
  r2[1]="n23"
  r3[0]="lanB"
  r3[1]="n23"
  r3[2]="n34"
  r4[0]="n34"
  r4[1]="n41"

convergence_time: 60   # IGP: margine abbondante per adiacenze e SPF
default_image: kathara/frr

test:
  requiring_startup:
    - pc_a
    - pc_b
    - r1
    - r2
    - r3
    - r4

  ip_mapping:
    pc_a:
      "0": 192.168.10.10/24
    pc_b:
      "0": 192.168.20.10/24
    r1:
      "0": 192.168.10.1/24
      "1": 10.0.0.1/30
      "2": 10.0.0.14/30
    r2:
      "0": 10.0.0.2/30
      "1": 10.0.0.5/30
    r3:
      "0": 192.168.20.1/24
      "1": 10.0.0.6/30
      "2": 10.0.0.9/30
    r4:
      "0": 10.0.0.10/30
      "1": 10.0.0.13/30

  daemons:
    r1: &router ["zebra", "ospfd"]
    r2: *router
    r3: *router
    r4: *router
    pc_a: &host ["!ospfd"]
    pc_b: *host

  protocols:
    ospfd:
      # Adiacenze dell'anello, identificate dal router-id (= loopback)
      neighbors:
        r1:
          - router_id: 10.255.0.2
          - router_id: 10.255.0.4
        r2:
          - router_id: 10.255.0.1
          - router_id: 10.255.0.3
        r3:
          - router_id: 10.255.0.2
          - router_id: 10.255.0.4
        r4:
          - router_id: 10.255.0.3
          - router_id: 10.255.0.1

      # Vincoli 1, 2, 3 e 5: area 0, LAN passive, costi e link punto-punto
      interfaces:
        r1:
          lo: {area: 0.0.0.0}
          eth0: {area: 0.0.0.0, timerPassiveIface: true}
          eth1: {area: 0.0.0.0, networkType: POINTOPOINT, cost: 10}
          eth2: {area: 0.0.0.0, networkType: POINTOPOINT, cost: 100}
        r2:
          lo: {area: 0.0.0.0}
          eth0: {area: 0.0.0.0, networkType: POINTOPOINT, cost: 10}
          eth1: {area: 0.0.0.0, networkType: POINTOPOINT, cost: 10}
        r3:
          lo: {area: 0.0.0.0}
          eth0: {area: 0.0.0.0, timerPassiveIface: true}
          eth1: {area: 0.0.0.0, networkType: POINTOPOINT, cost: 10}
          eth2: {area: 0.0.0.0, networkType: POINTOPOINT, cost: 100}
        r4:
          lo: {area: 0.0.0.0}
          eth0: {area: 0.0.0.0, networkType: POINTOPOINT, cost: 100}
          eth1: {area: 0.0.0.0, networkType: POINTOPOINT, cost: 100}

  # Tabelle di routing complete (escluse le reti connesse). Il checker conta le
  # rotte, quindi vanno elencate tutte. Le /32 compaiono senza prefisso in
  # `ip route`. Il next-hop verifica il vincolo 3 (percorso primario via r2).
  kernel_routes:
    pc_a:
      - ["0.0.0.0/0", ["192.168.10.1"]]
    pc_b:
      - ["0.0.0.0/0", ["192.168.20.1"]]
    r1:
      - ["192.168.20.0/24", ["10.0.0.2"]]
      - ["10.0.0.4/30", ["10.0.0.2"]]
      - ["10.0.0.8/30", ["10.0.0.2"]]
      - ["10.255.0.2", ["10.0.0.2"]]
      - ["10.255.0.3", ["10.0.0.2"]]
      - ["10.255.0.4", ["10.0.0.13"]]
    r2:
      - ["192.168.10.0/24", ["10.0.0.1"]]
      - ["192.168.20.0/24", ["10.0.0.6"]]
      - ["10.0.0.8/30", ["10.0.0.6"]]
      - ["10.0.0.12/30", ["10.0.0.1"]]
      - ["10.255.0.1", ["10.0.0.1"]]
      - ["10.255.0.3", ["10.0.0.6"]]
      - 10.255.0.4   # due percorsi di pari costo (ECMP): basta la presenza
    r3:
      - ["192.168.10.0/24", ["10.0.0.5"]]
      - ["10.0.0.0/30", ["10.0.0.5"]]
      - ["10.0.0.12/30", ["10.0.0.5"]]
      - ["10.255.0.1", ["10.0.0.5"]]
      - ["10.255.0.2", ["10.0.0.5"]]
      - ["10.255.0.4", ["10.0.0.10"]]
    r4:
      - ["192.168.10.0/24", ["10.0.0.14"]]
      - ["192.168.20.0/24", ["10.0.0.9"]]
      - ["10.0.0.0/30", ["10.0.0.14"]]
      - ["10.0.0.4/30", ["10.0.0.9"]]
      - ["10.255.0.1", ["10.0.0.14"]]
      - ["10.255.0.3", ["10.0.0.9"]]
      - 10.255.0.2   # ECMP, come sopra

  # Vincolo 4 e obiettivo del lab: loopback e sedi raggiungibili
  reachability:
    pc_a:
      - 10.255.0.1
      - 10.255.0.2
      - 10.255.0.3
      - 10.255.0.4
      - 192.168.20.10
    pc_b:
      - 10.255.0.1
      - 10.255.0.2
      - 10.255.0.3
      - 10.255.0.4
      - 192.168.10.10
    r1: &loopback
      - 10.255.0.1
      - 10.255.0.2
      - 10.255.0.3
      - 10.255.0.4
    r2: *loopback
    r3: *loopback
    r4: *loopback

  custom_commands:
    r1:
      - command: ip -4 addr show lo
        regex_match: "10\\.255\\.0\\.1/32"
    r2:
      - command: ip -4 addr show lo
        regex_match: "10\\.255\\.0\\.2/32"
    r3:
      - command: ip -4 addr show lo
        regex_match: "10\\.255\\.0\\.3/32"
    r4:
      - command: ip -4 addr show lo
        regex_match: "10\\.255\\.0\\.4/32"
    pc_a:
      # Il secondo hop deve essere r2 (10.0.0.2): percorso primario
      - command: traceroute -n -q 1 -w 1 192.168.20.10
        regex_match: "(?m)^\\s*2\\s+10\\.0\\.0\\.2\\s"
