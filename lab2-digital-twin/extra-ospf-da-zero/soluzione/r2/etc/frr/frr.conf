frr defaults traditional
hostname r2
service integrated-vtysh-config
!
! n12 verso r1: percorso primario
interface eth0
 ip ospf network point-to-point
 ip ospf cost 10
!
! n23 verso r3: percorso primario
interface eth1
 ip ospf network point-to-point
 ip ospf cost 10
!
router ospf
 ospf router-id 10.255.0.2
 network 10.255.0.2/32 area 0
 network 10.0.0.0/30 area 0
 network 10.0.0.4/30 area 0
!
