frr defaults traditional
hostname r1
service integrated-vtysh-config
!
! LAN della sede A: annunciata ma passiva (nessun vicino OSPF da questa parte)
interface eth0
 ip ospf passive
!
! n12 verso r2: percorso primario
interface eth1
 ip ospf network point-to-point
 ip ospf bfd
 ip ospf cost 10
!
! n41 verso r4: percorso di backup
interface eth2
 ip ospf network point-to-point
 ip ospf bfd
 ip ospf cost 100
!
router ospf
 ospf router-id 10.255.0.1
 network 10.255.0.1/32 area 0
 network 192.168.10.0/24 area 0
 network 10.0.0.0/30 area 0
 network 10.0.0.12/30 area 0
!
