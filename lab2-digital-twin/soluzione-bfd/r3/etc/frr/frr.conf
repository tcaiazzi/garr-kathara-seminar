frr defaults traditional
hostname r3
service integrated-vtysh-config
!
! LAN della sede B: annunciata ma passiva (nessun vicino OSPF da questa parte)
interface eth0
 ip ospf passive
!
! n23 verso r2: percorso primario
interface eth1
 ip ospf network point-to-point
 ip ospf bfd
 ip ospf cost 10
!
! n34 verso r4: percorso di backup
interface eth2
 ip ospf network point-to-point
 ip ospf bfd
 ip ospf cost 100
!
router ospf
 ospf router-id 10.255.0.3
 network 10.255.0.3/32 area 0
 network 192.168.20.0/24 area 0
 network 10.0.0.4/30 area 0
 network 10.0.0.8/30 area 0
!
