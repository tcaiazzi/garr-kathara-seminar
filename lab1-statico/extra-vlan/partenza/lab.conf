LAB_DESCRIPTION="Lab 1, extra - Due VLAN tra le sedi (punto di partenza)"
LAB_VERSION=2.0
LAB_AUTHOR="Seminario GARR su Kathara"

# Ogni host ha la sua LAN, collegata a una porta dedicata dello switch (s1 o s2).
# Su n12 passa il trunk con le due VLAN taggate.

pc1[0]="lan1"
pc1[image]="kathara/base"

pc4[0]="lan4"
pc4[image]="kathara/base"

s1[0]="lan1"
s1[1]="n12"
s1[2]="lan4"
s1[image]="kathara/base"

s2[0]="n12"
s2[1]="lan2"
s2[2]="lan3"
s2[image]="kathara/base"

pc2[0]="lan2"
pc2[image]="kathara/base"

pc3[0]="lan3"
pc3[image]="kathara/base"
